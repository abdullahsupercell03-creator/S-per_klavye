
name: SuperKlavye APK Derleme

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ZIP dosyasını aç
        run: |
          mkdir proje
          unzip -q SuperKlavye_Android_Projesi.zip -d proje

      - name: APK oluştur
        run: gradle -p proje assembleDebug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: SuperKlavye-APK
          path: proje/app/build/outputs/apk/debug/app-debug.apk
          
